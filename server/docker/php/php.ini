memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
expose_php = Off
date.timezone = Europe/Oslo

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; sett 1 i staging om dere vil slippe restart ved kodeendring
