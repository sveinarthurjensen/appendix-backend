# Appendix backend – Laravel-grunnmur
# Ett oppsett for både staging og prod; miljøet styres av .env (APP_ENV, APP_URL, domener).
name: appendix-backend

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file: .env
  volumes:
    - ./src:/var/www/html
    - ./.env:/var/www/html/.env
    - storage:/var/www/html/storage
    - ./backups:/backups:ro          # pg_dump-filer fra pgbackup → OneDrive-jobben
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:                       # php-fpm
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s

  horizon:                   # køer (Redis) med retry/dead-letter
    <<: *app
    command: php artisan horizon
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:                 # cron-erstatning: schedule:work kjører hvert minutt
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8080:80"  # eksponeres KUN lokalt; Caddy/reverse proxy foran gjør TLS
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    # ingen "ports:" – databasen er kun nåbar fra docker-nettet

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  # TLS + reverse proxy. Caddy henter Let's Encrypt-sertifikat automatisk.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    depends_on: [nginx]
    restart: unless-stopped

  # Nattlig dump av PostgreSQL til ./backups (synk videre til objektlager i EU)
  pgbackup:
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 12
      HEALTHCHECK_PORT: 8081
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
  caddydata:
  caddyconfig:
